services:
  # FastAPI Backend Web Service
  - type: web
    name: skill2pocket-backend
    env: python
    region: singapore
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python ../database/seed/seed_data.py && gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skill2pocket-db
          property: connectionString
      - key: Yashwanth159.
        generateValue: true
      - key: AI_PROVIDER
        value: fallback

  # Next.js Frontend Web Service
  - type: web
    name: skill2pocket-frontend
    env: node
    region: singapore
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: skill2pocket-backend
          property: url

databases:
  # Managed PostgreSQL Database
  - name: skill2pocket-db
    databaseName: skill2pocket
    user: postgres
    region: singapore
