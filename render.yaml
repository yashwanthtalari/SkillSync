services:
  # FastAPI Backend Web Service on Render
  - type: web
    name: skill2pocket-backend
    env: python
    region: singapore
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python ../database/seed/seed_data.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Optional: Set to Supabase IPv4 Pooler (aws-0-xx.pooler.supabase.com:6543) or leave unset for automatic SQLite fallback
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://frrhtppatokgtyndkkub.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_BBUOiZIRE2F9UvoXffXgfw_kYs2e8pr
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: fallback


